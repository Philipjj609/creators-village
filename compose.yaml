name: creators-village-s1
services:
  db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    env_file: .local/database.env
    ports: ["127.0.0.1:55432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvillage -d creators_village"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
